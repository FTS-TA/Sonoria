name: CMake Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release]
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            vcpkg_triplet: x64-linux
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            vcpkg_triplet: x64-windows
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
            vcpkg_triplet: x64-osx

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libeigen3-dev \
          libfftw3-dev \
          libavcodec-dev \
          libavformat-dev \
          libavutil-dev \
          libswresample-dev \
          libsamplerate0-dev \
          libtag1-dev \
          libyaml-dev \
          libchromaprint-dev \
          pkg-config

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install \
          eigen \
          fftw \
          ffmpeg \
          libsamplerate \
          taglib \
          libyaml \
          chromaprint

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install pkgconfiglite

    - name: Configure CMake
      run: >
        cmake -B ${{ github.workspace }}/build
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DBUILD_SHARED_LIBS=ON
        -DBUILD_STATIC=OFF
        -DBUILD_EXAMPLES=OFF
        -DBUILD_PYTHON=OFF
        -DBUILD_VAMP=OFF
        -DBUILD_TESTS=OFF
        -DFFT_BACKEND=FFTW
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ github.workspace }}/build --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ github.workspace }}/build
      run: ctest --build-config ${{ matrix.build_type }} --output-on-failure
